name: Refresh profile activity

on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-profile.mjs'
      - '.github/workflows/profile-activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build profile artwork from public calendar
        run: node scripts/build-profile.mjs
      - name: Commit updated activity assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity assets/stack-*.svg assets/focus*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: refresh public profile activity'
          git push
