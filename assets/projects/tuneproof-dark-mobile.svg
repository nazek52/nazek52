<svg xmlns="http://www.w3.org/2000/svg" width="360" height="292" viewBox="0 0 360 292" role="img" aria-labelledby="title desc"><title id="title">TuneProof</title><desc id="desc">A LoRA experiment you can reproduce on a CPU. Held-out evaluation. Leakage-aware splits. A control run. The illustration is a conceptual diagram, not benchmark data.</desc><rect x="1" y="1" width="358" height="290" rx="16" fill="#111622" stroke="#34364d"/><path d="M24 23h30" stroke="#80daca" stroke-width="3"/><text x="63" y="27" fill="#c1a1ee" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="1.2" font-weight="700">LLM FINE-TUNING &amp; EVALUATION</text><text x="24" y="66" fill="#eeeaf8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">TuneProof</text><text x="24" y="94" fill="#a9abc2" font-family="Arial,Helvetica,sans-serif" font-size="13" >CPU-runnable LoRA experiments.</text><text x="24" y="114" fill="#a9abc2" font-family="Arial,Helvetica,sans-serif" font-size="13" >Held-out evaluation, careful splits</text><text x="24" y="134" fill="#a9abc2" font-family="Arial,Helvetica,sans-serif" font-size="13" >and a zero-learning-rate control.</text><text x="24" y="275" fill="#80daca" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing=".5">Python / PyTorch / LoRA</text><g transform="translate(92 151) scale(0.85)"><rect x="12" y="17" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.25"/><rect x="27" y="17" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.43"/><rect x="42" y="17" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.61"/><rect x="57" y="17" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.79"/><rect x="12" y="32" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.43"/><rect x="27" y="32" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.61"/><rect x="42" y="32" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.79"/><rect x="57" y="32" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.25"/><rect x="12" y="47" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.61"/><rect x="27" y="47" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.79"/><rect x="42" y="47" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.25"/><rect x="57" y="47" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.43"/><rect x="12" y="62" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.79"/><rect x="27" y="62" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.25"/><rect x="42" y="62" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.43"/><rect x="57" y="62" width="10" height="10" rx="2" fill="#c1a1ee" opacity="0.61"/><path d="M82 46h28m-7-7 7 7-7 7" fill="none" stroke="#80daca" stroke-width="2"/><rect x="126" y="13" width="48" height="67" rx="8" fill="#1b2334" stroke="#80daca"/><path d="m137 28 3 3 5-6m7 3h12" stroke="#80daca" stroke-width="2" fill="none"/><path d="m137 44 3 3 5-6m7 3h12" stroke="#80daca" stroke-width="2" fill="none"/><path d="m137 60 3 3 5-6m7 3h12" stroke="#80daca" stroke-width="2" fill="none"/></g><text x="336" y="275" fill="#a9abc2" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="end">01</text></svg>
