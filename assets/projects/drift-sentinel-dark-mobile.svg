<svg xmlns="http://www.w3.org/2000/svg" width="360" height="292" viewBox="0 0 360 292" role="img" aria-labelledby="title desc"><title id="title">Drift Sentinel</title><desc id="desc">Follow model quality as the data changes. Time-aware evaluation and delayed-label diagnostics. The illustration is a conceptual diagram, not benchmark data.</desc><rect x="1" y="1" width="358" height="290" rx="16" fill="#111622" stroke="#34364d"/><path d="M24 23h30" stroke="#80daca" stroke-width="3"/><text x="63" y="27" fill="#c1a1ee" font-family="Arial,Helvetica,sans-serif" font-size="9" letter-spacing="1.2" font-weight="700">MODEL EVALUATION &amp; MONITORING</text><text x="24" y="66" fill="#eeeaf8" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">Drift Sentinel</text><text x="24" y="94" fill="#a9abc2" font-family="Arial,Helvetica,sans-serif" font-size="13" >Model monitoring on synthetic data.</text><text x="24" y="114" fill="#a9abc2" font-family="Arial,Helvetica,sans-serif" font-size="13" >Time-aware evaluation and</text><text x="24" y="134" fill="#a9abc2" font-family="Arial,Helvetica,sans-serif" font-size="13" >delayed-label drift diagnostics.</text><text x="24" y="275" fill="#80daca" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing=".5">Python / scikit-learn / MLOps</text><g transform="translate(92 151) scale(0.85)"><path d="M10 13v76h168M10 37h168M10 63h168" fill="none" stroke="#34364d"/><path d="M13 73c22 0 20-18 39-17s23 10 41-2 33-24 80-24" fill="none" stroke="#c1a1ee" stroke-width="3"/><path d="M13 73c22 0 20-18 39-17s23 10 41-2 33 15 80-36" fill="none" stroke="#80daca" stroke-width="3"/><path d="M112 12v79" stroke="#a9abc2" stroke-dasharray="3 5"/><circle cx="173" cy="18" r="4" fill="#80daca"/></g><text x="336" y="275" fill="#a9abc2" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="end">03</text></svg>
